name: Build Sapphire CN
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        default: Release
        options: [Release, Debug]
      architecture:
        type: choice
        default: universal
        options: [universal, arm64, x86_64]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      BUILD_ARCHS: ${{ inputs.architecture != 'universal' && inputs.architecture || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: spm
        with:
          path: build-cn/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
      - name: Check localization resources
        run: python3 scripts/check-localization.py
      - name: Verify language lookup at runtime
        run: |
          xcrun swiftc -module-cache-path "$RUNNER_TEMP/l10n-cache" Sapphire/App/Localization.swift scripts/LocalizationProbe.swift -o "$RUNNER_TEMP/l10n-probe"
          "$RUNNER_TEMP/l10n-probe" "$PWD/Sapphire"
      - name: Verify NetEase source isolation and recording matching
        run: scripts/test-netease.sh
      - name: Verify NetEase control queue and permission handling
        run: scripts/test-netease-bridge.sh
      - name: Verify NetEase refresh coalescing
        run: scripts/test-netease-refresh.sh
      - name: Verify bounded notch size reporting
        run: scripts/test-notch-sizing.sh
      - name: Verify continuous transfer progress stays sharp
        run: scripts/test-notch-progress-resize.sh
      - name: Verify music appearance migration and display bounds
        run: scripts/test-music-player-appearance.sh
      - name: Verify native text input policies and adapters
        run: scripts/test-public-text-input.sh
      - name: Verify desktop lyrics preferences and event scheduling
        run: scripts/test-desktop-lyrics.sh
      - name: Verify monitoring display and pagination
        run: scripts/test-monitoring-format.sh
      - name: Verify public feature availability
        run: scripts/test-public-features.sh
      - name: Verify local image and PDF text recognition
        run: scripts/test-text-recognition.sh
      - name: Verify clipboard URL and auto-clear policies
        run: scripts/test-clipboard-tools.sh
      - name: Verify non-destructive media exports
        run: scripts/test-media-optimizer.sh
      - name: Verify nested signing and tamper rejection
        run: scripts/test-signing.sh
      - name: Build and ad-hoc sign
        run: |
          set -o pipefail
          scripts/build-cn.sh 2>&1 | tee build.log
      - uses: actions/cache/save@v4
        if: always() && steps.spm.outputs.cache-hit != 'true'
        with:
          path: build-cn/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sapphire-CN-${{ env.CONFIGURATION }}-${{ env.BUILD_ARCHS || 'universal' }}
          path: |
            build-cn/Sapphire-CN.zip
            build-cn/Sapphire-CN.zip.sha256
            build.log
          if-no-files-found: warn
